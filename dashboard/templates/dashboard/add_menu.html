{% extends 'dashboard/base.html' %}
{% block title %}ARTÉ — Add Menu Item{% endblock %}
{% block page_title %}Add Menu Item{% endblock %}
{% block topbar_actions %}
<a href="{% url 'dashboard:menu' %}" class="gold-button">Back to Menu</a>
{% endblock %}
{% block content %}
<article class="dashboard-card form-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="name" required placeholder="e.g. Truffle Pasta">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Short description..."></textarea>
        </div>
        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" name="price" step="0.01" required placeholder="890">
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                <option value="">Select category</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Image (optional)</label>
            <input type="file" name="image" accept="image/*">
        </div>
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_available" checked>
                Available
            </label>
        </div>
        <button type="submit" class="gold-button" style="width:100%; justify-content:center;">
            <i class="fa-solid fa-plus"></i> Add Item
        </button>
    </form>
</article>
{% endblock %}
