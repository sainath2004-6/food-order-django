    </div>

    <nav class="admin-nav">
        <div class="nav-section-title">OVERVIEW</div>
        <a href="{% url 'dashboard:admin' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'admin' %}active{% endif %}">
            <span class="nav-icon"><i class="fa-solid fa-grid-2"></i></span>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'dashboard:orders' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'orders' or request.resolver_match.url_name == 'update_order_status' or request.resolver_match.url_name == 'delete_order' %}active{% endif %}">
            <span class="nav-icon"><i class="fa-solid fa-bag-shopping"></i></span>

        </a>

        <div class="nav-section-title">MANAGEMENT</div>
        <a href="{% url 'dashboard:menu' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'menu' or request.resolver_match.url_name == 'add_menu' or request.resolver_match.url_name == 'edit_menu' %}active{% endif %}">

        </a>
        <a href="{% url 'dashboard:categories' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'categories' or request.resolver_match.url_name == 'delete_category' %}active{% endif %}">

        </a>

        <a href="{% url 'dashboard:reservations' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'reservations' or request.resolver_match.url_name == 'update_reservation_status' or request.resolver_match.url_name == 'delete_reservation' %}active{% endif %}">

        <a href="{% url 'dashboard:queries' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'queries' or request.resolver_match.url_name == 'reply_query' %}active{% endif %}">

        </a>
